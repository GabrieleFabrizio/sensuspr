<VirtualHost *:80>
    DocumentRoot /var/www/html
    DirectoryIndex index.php index.html

    <Directory /var/www/html>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Traefik terminates TLS and forwards over plain HTTP; trust its
    # X-Forwarded-Proto header so $_SERVER['HTTPS'] and mod_rewrite's
    # %{HTTPS} reflect the original scheme (avoids an HTTPS redirect loop).
    SetEnvIf X-Forwarded-Proto "https" HTTPS=on

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
